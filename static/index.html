<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Learning Hub — Personal LMS</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/css/styles.css">
  <!-- Favicon icon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
</head>
<body class="h-full text-slate-800 antialiased font-sans flex flex-col">

  <!-- Unauthenticated Views Container (Login & Register) -->
  <div id="auth-content" class="min-h-screen hidden"></div>

  <!-- Authenticated App Shell -->
  <div id="app-shell" class="flex h-screen overflow-hidden hidden">
    <!-- Desktop Sidebar Navigation -->
    <aside class="hidden md:flex md:w-64 md:flex-col bg-white border-r border-slate-200/80 shrink-0">
      <div class="flex flex-col h-full">
        <!-- Logo / Brand Header -->
        <div class="h-16 flex items-center px-6 border-b border-slate-100 gap-3">
          <div class="w-8 h-8 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-sm shadow-sm shadow-blue-500/30">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
          </div>
          <div>
            <span class="text-sm font-bold text-slate-900 block leading-tight">My Learning Hub</span>
            <span class="text-[10px] font-semibold text-blue-600 block uppercase tracking-wider">MBA Edition</span>
          </div>
        </div>

        <!-- Sidebar Navigation Items -->
        <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
          <a href="#dashboard" data-route="dashboard" class="sidebar-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold bg-blue-50 text-blue-700">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
            Dashboard
          </a>

          <a href="#courses" data-route="courses" class="sidebar-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100/70">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
            My Courses
          </a>

          <a href="#library" data-route="library" class="sidebar-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100/70">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
            Resource Library
          </a>

          <a href="#notes" data-route="notes" class="sidebar-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100/70">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            Notes
          </a>

          <a href="#bookmarks" data-route="bookmarks" class="sidebar-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100/70">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
            Bookmarks
          </a>

          <a href="#progress" data-route="progress" class="sidebar-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100/70">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
            Study Progress
          </a>

          <a href="#tasks" data-route="tasks" class="sidebar-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100/70">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            Assignments &amp; Deadlines
          </a>

          <div class="pt-4 pb-2">
            <div class="h-px bg-slate-100 mx-2"></div>
          </div>

          <a href="#profile" data-route="profile" class="sidebar-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100/70">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            My Profile
          </a>

          <a href="#settings" data-route="settings" class="sidebar-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-100/70">
            <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            Settings &amp; Backup
          </a>
        </nav>

        <!-- Sidebar Footer / Quick User Info -->
        <div class="p-3 border-t border-slate-100">
          <div class="flex items-center justify-between p-2 rounded-xl bg-slate-50 border border-slate-100">
            <div class="flex items-center gap-2.5 min-w-0 pr-2">
              <div class="w-7 h-7 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-xs shrink-0" id="header-avatar">
                U
              </div>
              <div class="min-w-0">
                <span class="text-xs font-semibold text-slate-800 truncate block" id="header-user-name">Student</span>
                <span class="text-[10px] text-slate-400 block truncate">MBA Candidate</span>
              </div>
            </div>
            <button id="header-logout-btn" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-white transition-colors" title="Log Out">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            </button>
          </div>
        </div>
      </div>
    </aside>

    <!-- Mobile Drawer Sidebar (Toggled on small screens) -->
    <div id="mobile-drawer" class="fixed inset-0 z-50 flex md:hidden hidden">
      <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs" id="mobile-drawer-close"></div>
      <div class="relative flex-1 flex flex-col max-w-xs w-full bg-white">
        <div class="p-4 border-b border-slate-100 flex items-center justify-between">
          <span class="text-sm font-bold text-slate-900">My Learning Hub</span>
          <button class="p-1 text-slate-400" onclick="document.getElementById('mobile-drawer').classList.add('hidden')">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
          <a href="#dashboard" class="flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-semibold text-slate-700">Dashboard</a>
          <a href="#courses" class="flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-semibold text-slate-700">My Courses</a>
          <a href="#library" class="flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-semibold text-slate-700">Resource Library</a>
          <a href="#notes" class="flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-semibold text-slate-700">Notes</a>
          <a href="#bookmarks" class="flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-semibold text-slate-700">Bookmarks</a>
          <a href="#progress" class="flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-semibold text-slate-700">Study Progress</a>
          <a href="#tasks" class="flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-semibold text-slate-700">Assignments</a>
          <a href="#profile" class="flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-semibold text-slate-700">My Profile</a>
          <a href="#settings" class="flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-semibold text-slate-700">Settings &amp; Backup</a>
        </nav>
      </div>
    </div>

    <!-- Main Content Container with Top Header -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
      <!-- Top Application Header -->
      <header class="h-16 bg-white border-b border-slate-200/80 px-4 sm:px-8 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-3">
          <button id="mobile-menu-toggle" class="p-2 -ml-2 text-slate-500 hover:text-slate-700 md:hidden rounded-lg">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>

          <!-- Global Search Trigger Pill -->
          <button id="top-search-btn" class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-400 hover:text-slate-600 border border-slate-200 text-xs transition-colors w-44 sm:w-72">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <span class="truncate">Search resources, tags, topics...</span>
            <kbd class="hidden sm:inline-block ml-auto text-[10px] font-mono px-1.5 py-0.5 rounded bg-white border border-slate-200 text-slate-400">Ctrl+K</kbd>
          </button>
        </div>

        <!-- Right Quick Actions -->
        <div class="flex items-center gap-2.5">
          <button onclick="window.appModals.openUploadResource()" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-xs transition-colors">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
            <span class="hidden sm:inline">Upload Resource</span>
          </button>
        </div>
      </header>

      <!-- View Area -->
      <main class="flex-1 overflow-y-auto p-4 sm:p-8 bg-slate-50/60" id="main-content">
        <!-- Rendered view goes here -->
      </main>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none [&>*]:pointer-events-auto"></div>

  <!-- Modal Container -->
  <div id="modal-container"></div>

  <!-- Core App Scripts -->
  <script src="/static/js/api.js"></script>
  <script src="/static/js/components.js"></script>
  <script src="/static/js/views/auth.js"></script>
  <script src="/static/js/views/dashboard.js"></script>
  <script src="/static/js/views/courses.js"></script>
  <script src="/static/js/views/library.js"></script>
  <script src="/static/js/views/reader.js"></script>
  <script src="/static/js/views/notes.js"></script>
  <script src="/static/js/views/bookmarks.js"></script>
  <script src="/static/js/views/progress.js"></script>
  <script src="/static/js/views/tasks.js"></script>
  <script src="/static/js/views/profile.js"></script>
  <script src="/static/js/views/settings.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
